# Full reference configuration: every worker and unified-vamoose setting
# with its default. The slim file most installs need is
# examples/vamoose.toml (installed as /etc/vamoose/vamoose.toml.example);
# only [run] and [mover] src_url/dst_url are required. This same file
# works with `mig-worker` and every configuration-consuming `vamoose`
# subcommand. See DESIGN.md "Configuration" for full semantics.

[run]
bucket     = "vamoose"
endpoint   = "https://s3.example.com"
region     = "us-east-1"
# profile  = "vamoose"      # named ~/.aws/credentials profile; omit to use the default chain
                            # (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY from /etc/vamoose/vamoose.env)
verify_tls = true          # false skips S3 certificate verification entirely (lab/dev only)

[worker]
# host_id = "worker-07"     # auto-generated if omitted
heartbeat_sec     = 30
lease_timeout_sec = 180     # 3 min, 6× heartbeat

[shard]
local_scratch  = "/var/lib/mig/scratch"   # tmpfs strongly preferred
max_in_flight  = 1                         # shards concurrently in this worker

[mover]
strategy_default     = "libnfs_io_uring"   # compatibility name retained; regular files use libnfs
src_url              = "nfs://src-server/source-export"
dst_url              = "nfs://dst-server/dest-export"
# Source and destination MUST be distinct exports OR distinct roots
# on the same export. The worker refuses to start if they overlap.
nfs_connections      = 16
# Per-RPC timeout (milliseconds), applied to every libnfs context at
# creation — bounds each RPC, including the mount itself. Timed-out
# RPCs surface as "Command timed out" and classify as
# retryable/transient, never as shard corruption. 0 = leave the
# libnfs built-in default untouched (nfs_set_timeout is not called).
# Default: 60000 — matches libnfs's implicit 60 s, now explicit.
rpc_timeout_ms       = 60000
# Raw NFSv3 filehandle fast path for regular files: cached parent-dir
# filehandles, READDIRPLUS child-FH prefetch, attrs stamped at CREATE,
# one SETATTR — ~5 RPCs per small file instead of the path-based API's
# per-component LOOKUP storm. Off by default.
#use_raw_fh = true
# With use_raw_fh: CREATE the final name directly and skip the
# .partial + RENAME publish (~4 RPCs per typical small file). A crash can
# leave a torn file visible at the final path; a re-run heals it.
# Only for destinations nothing consumes mid-migration. Off by default.
#direct_commit = true
# Compatibility-reserved fields. They remain accepted with the same defaults
# but do not tune the current sync or bucketed async libnfs paths.
pipeline_depth       = 8
io_uring_queue_depth = 256
fixed_buffer_count   = 256
fixed_buffer_size    = "1 MiB"

[batch]
bytes_budget       = "8 GiB"
files_budget       = 100000
inflight_small     = 256       # files < 1 MiB
inflight_medium    = 16        # 1 MiB – 1 GiB
inflight_large     = 4         # > 1 GiB
large_stripe_size  = "4 MiB"
large_stripe_depth = 32

[copy]
preserve_owner            = true
preserve_mode             = true
preserve_times            = true
preserve_xattr            = true   # honored when walker emits xattr_blob; no-op until then
server_side_copy          = "off"  # compatibility-reserved; NFSv4.2 COPY is not implemented.
require_chown_capability  = true   # default; refuse to start if preserve_owner=true
                                    # but the worker doesn't hold CAP_CHOWN.
                                    # Set false to downgrade chown EPERM to a per-file
                                    # warning (recorded to failures/).
require_unchanged_size    = false  # default; treat row.size as advisory.
                                    # Set true to fail any file whose post-copy byte
                                    # count differs from the indexed size
                                    # (FailurePhase::Open, error tag SIZE_CHANGED).

[backpressure]
failure_pct_window_sec = 60
failure_pct_threshold  = 5.0
throughput_floor_mb_s  = 100

# Optional control plane. One table serves the worker (client wiring),
# `vamoose coord` (daemon settings), and `vamoose tui` (token file).
#[coord]
#url                = "http://node1.example.com:8443"   # workers + TUI connect here
## job_id           = "run-id"        # default: the run id in the bucket's manifest.json
#cluster_secret_env = "VAMOOSE_CLUSTER_SECRET"           # env var from /etc/vamoose/vamoose.env
#verify_tls         = true            # false for self-signed coord certs
## --- daemon-only settings ---
#listen             = "0.0.0.0:8443"
#no_tls             = true            # or set tls_cert/tls_key for HTTPS
## tls_cert         = "/etc/vamoose/coord.crt"
## tls_key          = "/etc/vamoose/coord.key"
#admin_tokens_file  = "/etc/vamoose/admin-token"        # one token per line; TUI uses the first
