# cargo-about configuration.
#
# Generates THIRD_PARTY_LICENSES bundle for distribution. Run with:
#   cargo install --locked cargo-about
#   cargo about generate about.hbs > THIRD_PARTY_LICENSES.md
#
# CI runs this on every push to main and uploads the result as a
# workflow artifact.

# Same allowlist as deny.toml (kept in sync — if you add a license
# here, add it in deny.toml too).
accepted = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

# Walk transitive dependencies — we ship them, so we credit them.
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

# Named upstream workarounds for crates whose license files need
# special handling. `ring` is in the tree via the legacy-rustls-ring
# feature of aws-smithy-http-client.
workarounds = ["ring"]

# Workspace crates are `publish = false`; skip them — they're
# vamoose's own code, not third party.
private = { ignore = true }
