[package]
name        = "migration-tui"
version     = { workspace = true }
edition     = { workspace = true }
authors     = { workspace = true }
license     = { workspace = true }
description = "Operator TUI for vamoose coord (live REST + SSE dashboard)"
publish     = false

[lib]
name = "migration_tui"
path = "src/lib.rs"

[dependencies]
# Shared control-plane schema, REST bodies, and Snapshot reducer.
migration-protocol = { workspace = true }

tokio       = { workspace = true }
tokio-util  = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
anyhow      = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
chrono      = { workspace = true }
futures     = { workspace = true }
async-stream = { workspace = true }

# HTTP client + SSE byte-stream over reqwest.
reqwest = { workspace = true }
bytes   = { workspace = true }

# Rendering layer — wired in step 4b, declared here so the workspace
# resolves them in one shot. The `event-stream` feature enables
# crossterm::event::EventStream so the TUI loop can `select!` on
# keyboard input alongside the SSE channel and the render tick.
ratatui   = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }

[dev-dependencies]
# Bring up an in-process coordinator for the integration test.
migration-coord = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-util = { workspace = true }

axum-server = { workspace = true }
http        = { workspace = true }
