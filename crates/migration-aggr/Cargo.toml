[package]
name        = "migration-aggr"
version     = { workspace = true }
edition     = { workspace = true }
authors     = { workspace = true }
license     = { workspace = true }
description = "Read-only observability sidecar (mig-aggr)"
publish     = false

[[bin]]
name = "mig-aggr"
path = "src/main.rs"

# `clean-partials` is the one real subcommand; the observability
# subcommands are still stubs. Re-add ratatui / prometheus / hyper
# alongside their real implementations.
[dependencies]
migration-core = { workspace = true }
tokio      = { workspace = true }
anyhow     = { workspace = true }
tracing-subscriber = { workspace = true }
clap       = { workspace = true }
chrono     = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
migration-core = { workspace = true, features = ["test-util"] }
tempfile       = "3"
