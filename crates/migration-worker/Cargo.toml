[package]
name        = "migration-worker"
version     = { workspace = true }
edition     = { workspace = true }
authors     = { workspace = true }
license     = { workspace = true }
description = "Migration worker binary (mig-worker)"
publish     = false

[lib]
name = "migration_worker"
path = "src/lib.rs"

[[bin]]
name = "mig-worker"
path = "src/main.rs"

[dependencies]
migration-core  = { workspace = true }
migration-mover = { workspace = true }
# Schema types (EventKind, WorkerId, RegisterBody shape) shared with
# the coord. Drift between worker wire calls and coord handlers is
# caught at compile time by reusing the same types.
migration-coord = { workspace = true }

tokio    = { workspace = true }
tokio-util = { workspace = true }
serde    = { workspace = true }
serde_json = { workspace = true }
anyhow   = { workspace = true }
thiserror = { workspace = true }
tracing  = { workspace = true }
tracing-subscriber = { workspace = true }
clap     = { workspace = true }
chrono   = { workspace = true }
crossbeam-channel = { workspace = true }
hex      = { workspace = true }
toml     = { workspace = true }
hostname = { workspace = true }
getrandom = { workspace = true }
libc     = { workspace = true }
uuid     = { workspace = true }

# HTTP client for the coord-facing wire layer (Phase 3).
reqwest = { workspace = true }

[dev-dependencies]
# Used by the orchestrator flush_sinks tests to implement the mock
# ClaimStore (the trait is declared with #[async_trait]).
async-trait = { workspace = true }
# Used by tests/coord_client_integration.rs to bring up an in-process
# coord (router + axum_server bind) and drive it from the client.
axum-server = { workspace = true }
http = { workspace = true }
axum = { workspace = true }
