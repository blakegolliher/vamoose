# cargo-deny configuration.
#
# Run locally:
#   cargo install --locked cargo-deny
#   cargo deny check
#
# CI runs this on every PR via .github/workflows/ci.yml.

# -----------------------------------------------------------------------------
# Advisories — block any dependency with an open RustSec advisory.
# -----------------------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# `ignore` is the escape hatch. Every entry needs a justification and
# a condition for removal.
ignore = [
    # `paste` is unmaintained (not vulnerable). Compile-time-only
    # proc-macro, pulled in by arrow/parquet 54. No runtime code ships.
    # Remove when the arrow family drops it (check on major bumps).
    "RUSTSEC-2024-0436",
    # The next three are rustls-webpki 0.101 certificate-VALIDATION
    # bugs. That crate only enters the tree via the pinned rustls
    # 0.21 / hyper-rustls 0.24 legacy stack, which exists solely to
    # implement `verify_tls = false` (see workspace Cargo.toml and
    # migration-core/src/s3.rs): on that path certificate validation
    # is deliberately skipped, so the vulnerable code never runs. The
    # default `verify_tls = true` path uses the AWS SDK's current
    # rustls. Remove all three when smithy exposes a supported
    # skip-verification knob and the legacy stack is dropped.
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
]

# -----------------------------------------------------------------------------
# Licenses — what's allowed to ship inside vamoose binaries.
#
# vamoose itself is AGPL-3.0-only (per workspace Cargo.toml). The
# deps allowlist is the small set of widely-permissive licenses
# we've already seen in the dependency tree. Anything outside this
# list needs a deliberate exception via `exceptions` below + a
# reviewer note explaining why.
# -----------------------------------------------------------------------------
[licenses]
confidence-threshold = 0.8
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    # `ring` and a few crypto crates use a hybrid OpenSSL/ISC-style
    # license that SPDX names "OpenSSL". Required by hyper-rustls.
    "OpenSSL",
    # `webpki-roots` ships the Mozilla/CCADB root-certificate data
    # under the Community Data License Agreement (permissive).
    "CDLA-Permissive-2.0",
]

# Per-crate exceptions — keep this empty by default. Use only when a
# critical dep has a non-standard license that's been reviewed.
exceptions = []

# -----------------------------------------------------------------------------
# Bans — duplicate versions, wildcard requirements, banned crates.
# -----------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal `{ path = ... }` deps carry no version field and
# would otherwise count as wildcards. All workspace crates are
# `publish = false`, which is what makes this exemption apply.
allow-wildcard-paths = true
highlight = "all"

# Skip the duplicate-versions check for common ecosystem churn where
# we can't easily unify (e.g. hashbrown / windows-sys / etc).
skip = []
skip-tree = []

# Crates we never want to depend on — leave empty until a concrete
# ban is needed.
deny = []

# -----------------------------------------------------------------------------
# Sources — only crates.io. Git deps are flagged unless explicitly
# allowed.
# -----------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
