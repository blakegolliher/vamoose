name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch/PR supersedes the running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ---------------------------------------------------------------------------
  # Fast lint gate: formatting + clippy. Split from build+test so a
  # style failure never masks the test signal.
  # ---------------------------------------------------------------------------
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install libnfs build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libnfs-dev pkg-config

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ---------------------------------------------------------------------------
  # Build + run the test suite.
  # ---------------------------------------------------------------------------
  test:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install libnfs build deps
        # migration-mover's build.rs links against libnfs. Match the
        # versions the lab cluster uses.
        run: |
          sudo apt-get update
          sudo apt-get install -y libnfs-dev pkg-config

      - name: cargo build
        run: cargo build --workspace --all-targets --locked

      - name: cargo test
        run: cargo test --workspace --locked

  # ---------------------------------------------------------------------------
  # MSRV: prove the `rust-version` promise in Cargo.toml. The toolchain
  # is read from the manifest so the declared value is always the
  # tested value — bumping one without the other is impossible.
  # `cargo check` (not test): MSRV verifies compilability; keep it fast.
  # ---------------------------------------------------------------------------
  msrv:
    name: msrv check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          msrv="$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)"
          test -n "$msrv" || { echo "no rust-version in Cargo.toml" >&2; exit 1; }
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}

      - uses: Swatinem/rust-cache@v2

      - name: Install libnfs build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libnfs-dev pkg-config

      - name: cargo check (MSRV)
        run: cargo check --workspace --all-targets --locked

  # ---------------------------------------------------------------------------
  # SCHEMA_CONTRACT.md drift vs the nfs-walker repo. The contract is
  # vendored byte-identical in both repos and promises "CI in either
  # repo should fail if its copy diverges from the other".
  #
  # The upstream repo location is environment-specific, so this job is
  # guarded: set the repository variable NFS_WALKER_REPO (e.g.
  # "blakegolliher/nfs-walker") to enable it; if the repo is private,
  # also set the NFS_WALKER_TOKEN secret to a read-scoped token. When
  # the variable is unset the job is skipped entirely — the always-on
  # local half of this check is the `contract_drift` test in
  # crates/migration-core/tests/, which pins schema.rs against our copy
  # of SCHEMA_CONTRACT.md on every `cargo test`.
  # ---------------------------------------------------------------------------
  contract-drift:
    name: schema contract drift vs nfs-walker
    if: vars.NFS_WALKER_REPO != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check out nfs-walker
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.NFS_WALKER_REPO }}
          token: ${{ secrets.NFS_WALKER_TOKEN || github.token }}
          path: .nfs-walker-upstream

      - name: Diff vendored SCHEMA_CONTRACT.md copies (byte-wise)
        run: |
          diff -u .nfs-walker-upstream/SCHEMA_CONTRACT.md SCHEMA_CONTRACT.md
          cmp .nfs-walker-upstream/SCHEMA_CONTRACT.md SCHEMA_CONTRACT.md

  # ---------------------------------------------------------------------------
  # cargo-deny: license allowlist, advisory db, banned wildcards,
  # crates.io-only sources. Config in deny.toml.
  # ---------------------------------------------------------------------------
  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  # ---------------------------------------------------------------------------
  # cargo-about: regenerate THIRD_PARTY_LICENSES.md and fail if the
  # committed copy has drifted. Config in about.toml + about.hbs.
  # ---------------------------------------------------------------------------
  licenses:
    name: third-party licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-about
        # Not taiki-e/install-action: cargo-about 0.9.1 has no prebuilt
        # binary there, and its source build omits the `cli` feature
        # that gates the binary — the install "succeeds" with nothing
        # installed. Pin the version so the committed bundle stays
        # byte-reproducible.
        run: cargo install cargo-about --version 0.9.1 --locked --features cli

      - name: Generate THIRD_PARTY_LICENSES.md
        # `cargo about generate` walks the workspace dependency
        # graph, materializes each crate's license text, and
        # renders it through about.hbs.
        run: cargo about generate about.hbs > THIRD_PARTY_LICENSES.md

      - name: Fail on license drift
        # The bundle is committed; regeneration must be a no-op.
        # If this fails, run the generate command above locally and
        # commit the result.
        run: git diff --exit-code THIRD_PARTY_LICENSES.md

      - uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.md
          if-no-files-found: error
          retention-days: 90
